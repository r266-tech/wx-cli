name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - name: Build pinned WCDB for encrypted macOS fixtures
        if: runner.os == 'macOS'
        run: |
          python3 scripts/prepare-release-inputs.py
          mkdir -p lib
          cp .build/libWCDB.dylib lib/libWCDB.dylib
          echo "WECHAT_CLI_WCDB_LIB=$PWD/lib/libWCDB.dylib" >> "$GITHUB_ENV"
      - name: Build pinned WCDB for encrypted Windows fixtures
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\scripts\build-windows-wcdb.ps1 -OutDir .\lib
          "WECHAT_CLI_WCDB_LIB=$((Resolve-Path .\lib\libWCDB.dll).Path)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: go test ./...
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build macOS with native Keychain
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: '1'
        run: go build -trimpath ./cmd/wechat-cli
      - name: Build Windows
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath ./cmd/wechat-cli
      - name: Validate macOS installers and release boundaries
        if: runner.os == 'macOS'
        run: |
          zsh -n install.sh scripts/install-release.sh
          bash -n scripts/package.sh
      - name: Test release verification and manifest generation
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Parse PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($script in @('install.ps1','scripts/install-release.ps1','scripts/package-windows.ps1','scripts/build-windows-wcdb.ps1','scripts/test_windows_release.ps1')) {
            $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $pwd $script),[ref]$null,[ref]$errors)
            if ($errors.Count -gt 0) { throw 'PowerShell parse failed' }
          }
      - name: Exercise Windows release and uninstall safety fixtures
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\test_windows_release.ps1
