name: Release macOS

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-macos-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test source at release tag
        run: |
          test "$(git describe --tags --exact-match HEAD)" = "$GITHUB_REF_NAME"
          go test ./...
          go vet ./...
          go test -race ./...
      - name: Resolve fixed wxkey source
        env:
          WXKEY_TAG: v1.4.8
          WXKEY_COMMIT: 9b70eec
        run: |
          git clone --depth 1 --branch "$WXKEY_TAG" https://github.com/r266-tech/wxkey.git "$RUNNER_TEMP/wxkey"
          test "$(git -C "$RUNNER_TEMP/wxkey" rev-parse HEAD | cut -c1-7)" = "$WXKEY_COMMIT"
          echo "WECHAT_CLI_WXKEY_COMMIT=$(git -C "$RUNNER_TEMP/wxkey" rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "WXKEY_SRC=$RUNNER_TEMP/wxkey" >> "$GITHUB_ENV"
      - name: Obtain pinned WCDB dylib
        env:
          WCDB_URL: ${{ vars.WECHAT_CLI_WCDB_DYLIB_URL }}
          WCDB_SHA256: ${{ vars.WECHAT_CLI_WCDB_DYLIB_SHA256 }}
        run: |
          test -n "$WCDB_URL"
          test -n "$WCDB_SHA256"
          curl -fsSL --retry 3 "$WCDB_URL" -o "$RUNNER_TEMP/libWCDB.dylib"
          echo "$WCDB_SHA256  $RUNNER_TEMP/libWCDB.dylib" | shasum -a 256 -c -
          echo "WECHAT_CLI_WCDB_DYLIB=$RUNNER_TEMP/libWCDB.dylib" >> "$GITHUB_ENV"
          echo "WECHAT_CLI_WCDB_SOURCE=$WCDB_URL" >> "$GITHUB_ENV"
          echo "WECHAT_CLI_WCDB_SHA256=$WCDB_SHA256" >> "$GITHUB_ENV"
      - name: Package and validate
        env:
          WECHAT_CLI_WXKEY_VERSION: v1.4.8
          WECHAT_CLI_WCDB_VERSION: pinned
          WECHAT_CLI_SIGNING_MODE: adhoc
          WECHAT_CLI_NOTARIZATION_STATUS: not_configured
          WECHAT_CLI_SOURCE_REPOSITORY: r266-tech/wx-cli
        run: |
          export SOURCE_DATE_EPOCH="$(date +%s)"
          version="${GITHUB_REF_NAME#v}"
          ./scripts/package.sh "$version"
          ./scripts/public-repo-scan.sh .
          python3 - <<'PY'
          import json, pathlib
          manifest = next(pathlib.Path('dist').glob('wechat-cli-v*-darwin-arm64/release-manifest.json'))
          data = json.loads(manifest.read_text())
          required = ['source_repository','commit','wxkey_commit','wcdb_source','wcdb_sha256','signing_mode','notarization_status']
          missing = [key for key in required if not data.get(key)]
          if missing:
              raise SystemExit('manifest missing: ' + ','.join(missing))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release-${{ github.ref_name }}
          path: |
            dist/wechat-cli-v*-darwin-arm64.zip
            dist/wechat-cli-v*-darwin-arm64.zip.sha256
            dist/wechat-cli-latest-darwin-arm64.zip
            dist/wechat-cli-latest-darwin-arm64.zip.sha256
            dist/install-release.sh
            dist/install-release.sh.sha256
            dist/install-release.ps1
            dist/install-release.ps1.sha256
            dist/wechat-cli-v*-darwin-arm64/release-manifest.json

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-release-${{ github.ref_name }}
          path: assets
      - name: Mint release repository token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.WECHAT_CLI_RELEASE_APP_ID }}
          private-key: ${{ secrets.WECHAT_CLI_RELEASE_APP_PRIVATE_KEY }}
          owner: r266-tech
          repositories: wechat-cli-releases
      - name: Create and publish draft release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test -n "$GH_TOKEN"
          version="${RELEASE_TAG#v}"
          cd assets/dist
          gh release create "$RELEASE_TAG" "wechat-cli-v$version-darwin-arm64.zip" "wechat-cli-v$version-darwin-arm64.zip.sha256" wechat-cli-latest-darwin-arm64.zip wechat-cli-latest-darwin-arm64.zip.sha256 install-release.sh install-release.sh.sha256 install-release.ps1 install-release.ps1.sha256 "wechat-cli-v$version-darwin-arm64/release-manifest.json" --repo r266-tech/wechat-cli-releases --draft --title "wechat-cli v$version" --notes "Automated macOS release from r266-tech/wx-cli tag $RELEASE_TAG"
          gh release view "$RELEASE_TAG" --repo r266-tech/wechat-cli-releases --json assets --jq '.assets | length' | grep -q '^9$'
          gh release edit "$RELEASE_TAG" --repo r266-tech/wechat-cli-releases --draft=false
